name: Backup database

# Weekly encrypted backup of the whole database (listings, statuses, reactions,
# comments, checklists, members, settings) as a workflow artifact, kept 90 days.
# The repository is public, so the file is encrypted with the BACKUP_PASSPHRASE secret
# (gpg, AES-256) and nothing is uploaded without it. Restore: README, "Kopia zapasowa".
on:
  schedule:
    - cron: "23 3 * * 0" # Sundays, ~4:23 Polish time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Set the DATABASE_URL and BACKUP_PASSPHRASE secrets (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Export and encrypt
        run: |
          name="homeseeker-$(date -u +%Y-%m-%d)"
          homeseeker backup "$RUNNER_TEMP/$name.json.gz"
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            -o "$RUNNER_TEMP/$name.json.gz.gpg" "$RUNNER_TEMP/$name.json.gz"
          rm "$RUNNER_TEMP/$name.json.gz"
          echo "BACKUP_FILE=$RUNNER_TEMP/$name.json.gz.gpg" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v6
        with:
          name: database-backup
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90
          if-no-files-found: error
