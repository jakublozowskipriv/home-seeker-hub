name: Smoke test (live portals)

# Runs the scrapers against the real portals without storing anything or notifying,
# so parser changes can be checked against live data.
on:
  push:
    branches: ["claude/**"]
    paths: ["src/**", ".github/workflows/smoke.yml"]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Diagnose portal access
        run: homeseeker diagnose
      - name: Diagnose Otodom pagination
        continue-on-error: true
        run: homeseeker diagnose otodom-pages
      - name: Diagnose Otodom investment pages
        continue-on-error: true
        run: homeseeker diagnose otodom-investment
      - name: Probe Otodom structure
        continue-on-error: true
        run: homeseeker probe otodom
      - name: Probe OLX structure
        continue-on-error: true
        run: homeseeker probe olx
      - name: Dry run
        run: homeseeker run --dry-run --max-pages 40 --max-details 20
