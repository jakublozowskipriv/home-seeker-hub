name: Scrape listings

on:
  schedule:
    # Co 3 godziny, ok. 7:17-22:17 czasu polskiego (cron jest w UTC).
    - cron: "17 5-20/3 * * *"
  workflow_dispatch:

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # keep the schedule alive (see last step)

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      HOMESEEKER_PREFERENCES: ${{ secrets.HOMESEEKER_PREFERENCES }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Run
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL is not set - running in dry-run mode (no storage, no notifications)."
            homeseeker run --dry-run
          else
            homeseeker run
          fi
      - name: Keep the schedule alive
        # GitHub disables scheduled workflows after 60 days without repository activity.
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/scrape.yml/enable" || true
